[project]
name = "short-video-script-agent"
version = "0.1.0"
description = "A short video script agent project scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".agent-tmp", ".cache", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# Chinese punctuation in comments and docstrings is intentional.
ignore = ["RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
